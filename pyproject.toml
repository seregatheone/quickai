[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quickai-codex"
version = "0.1.0"
description = "Local Codex session profiler inspired by quickai"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Sergey" }]
dependencies = []

[project.scripts]
quickai = "quickai.cli:main"

[tool.setuptools.packages.find]
include = ["quickai*"]
